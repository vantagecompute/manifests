name: Test Spark
on:
  pull_request:
    paths:
    - tests/install_KinD_create_KinD_cluster_install_kustomize.sh
    - .github/workflows/test_spark.yaml
    - applications/spark/**
    - tests/spark*.sh
    - tests/istio*
    - tests/multi_tenancy_install.sh
    - tests/profile_controller_install.sh
    - applications/dashboard/upstream/profile-controller/**
    - tests/oauth2-proxy_install.sh
    - common/cert-manager/**
    - common/oauth2-proxy/**
    - common/istio*/**

permissions:
  contents: read
  actions: read

# Set the repository variable USE_SELF_HOSTED_RUNNERS to "true" to run every
# job below on the vantage-eng self-hosted runner group (X64). To widen or
# narrow the runner set, set SELF_HOSTED_RUNS_ON to a runs-on value in JSON.
jobs:
  spark_test:
    runs-on: ${{ vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON(vars.SELF_HOSTED_RUNS_ON || '{"group":"vantage-eng","labels":["X64"]}') || 'ubuntu-26.04' }}
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # The KinD script installs kind, kubectl and kustomize here. GitHub-hosted
    # images already have kubectl and kustomize on PATH; self-hosted runners do not.
    - name: Put the KinD script's binaries on PATH
      run: echo "/tmp/usr/local/bin" >> "$GITHUB_PATH"

    - name: Install KinD, Create KinD cluster and Install kustomize
      run: ./tests/install_KinD_create_KinD_cluster_install_kustomize.sh

    - name: Create kubeflow namespace
      run: kustomize build common/kubeflow-namespace/base | kubectl apply -f -

    - name: Install Istio
      run: ./tests/istio-cni_install.sh

    - name: Install oauth2-proxy
      run: ./tests/oauth2-proxy_install.sh

    - name: Install cert-manager
      run: ./tests/cert_manager_install.sh

    - name: Install Profile Controller
      run: ./tests/profile_controller_install.sh

    - name: Install KF Multi Tenancy
      run: ./tests/multi_tenancy_install.sh

    - name: Create KF Profile
      run: kustomize build common/user-namespace/base | kubectl apply -f -

    - name: Build & Apply manifests
      run: |
        cd applications/spark
        # TODO remove the debugging lines
        ls -lah  ../../tests/
        chmod u+x ../../tests/*.sh
        ../../tests/spark_install.sh
        ../../tests/spark_test.sh "kubeflow-user-example-com"

    # Self-hosted runners keep state between jobs: delete the KinD cluster so
    # the next job can create its own.
    - name: Delete KinD cluster
      if: always()
      run: kind delete cluster --name kubeflow || true
