name: Image Extracting and Security Scanning

on:
  workflow_dispatch:
  push:
    branches:
    - master
  pull_request:
    paths:
    - tests/kustomize_install.sh
    - .github/workflows/osv-scanner.yaml
    - tests/osv_scanner_scan.py
    - tests/osv_scanner_install.sh

permissions:
  contents: read
  actions: read

# Set the repository variable USE_SELF_HOSTED_RUNNERS to "true" to run every
# job below on the vantage-eng self-hosted runner group (X64). To widen or
# narrow the runner set, set SELF_HOSTED_RUNS_ON to a runs-on value in JSON.
jobs:
  osv-scanner:
    if: ${{ github.repository == 'kubeflow/community-distribution' }}
    runs-on: ${{ vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON(vars.SELF_HOSTED_RUNS_ON || '{"group":"vantage-eng","labels":["X64"]}') || 'ubuntu-26.04' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Install kustomize
    - name: Install kustomize
      run: |
        bash tests/kustomize_install.sh

    # Install osv-scanner
    - name: Install osv-scanner
      run: |
        bash tests/osv_scanner_install.sh

    # Install Python
    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    # Install prettytable package
    - name: Install prettytable
      run: |
        pip install prettytable

    - name: Run image extracting and security scanning script
      run: |
        cd tests
        python3 osv_scanner_scan.py

    - name: Upload osv-scanner scanned_results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: osv_scanner_scanned_results
        path: image_lists/
