name: Test Pipeline run from Workspace
on:
  pull_request:
    paths:
    - tests/install_KinD_create_KinD_cluster_install_kustomize.sh
    - .github/workflows/workspaces_pipeline_run_test.yaml
    - applications/dashboard/**
    - applications/workspaces/**
    - applications/pipeline/upstream/**
    - tests/istio*
    - common/cert-manager/**
    - common/oauth2-proxy/**
    - common/istio*/**
    - common/kubeflow-namespace/**
    - tests/cert_manager_install.sh
    - tests/dashboard_install.sh
    - tests/multi_tenancy_install.sh
    - tests/pipelines_install.sh
    - tests/workspaces_install.sh
    - tests/workspaces_pipeline_run_test.sh
    - tests/workspacekind.test.yaml

permissions:
  contents: read
  actions: read

# Set the repository variable USE_SELF_HOSTED_RUNNERS to "true" to run every
# job below on the vantage-eng self-hosted runner group (X64). To widen or
# narrow the runner set, set SELF_HOSTED_RUNS_ON to a runs-on value in JSON.
jobs:
  workspaces_pipeline_run_test:
    runs-on: ${{ vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON(vars.SELF_HOSTED_RUNS_ON || '{"group":"vantage-eng","labels":["X64"]}') || 'ubuntu-26.04' }}
    timeout-minutes: 25
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # The KinD script installs kind, kubectl and kustomize here. GitHub-hosted
    # images already have kubectl and kustomize on PATH; self-hosted runners do not.
    - name: Put the KinD script's binaries on PATH
      run: echo "/tmp/usr/local/bin" >> "$GITHUB_PATH"

    - name: Install KinD, Create KinD cluster and Install kustomize
      run: ./tests/install_KinD_create_KinD_cluster_install_kustomize.sh

    - name: Create kubeflow namespace
      run: kustomize build common/kubeflow-namespace/base | kubectl apply -f -

    - name: Install Istio
      run: ./tests/istio-cni_install.sh

    - name: Install oauth2-proxy
      run: ./tests/oauth2-proxy_install.sh

    - name: Install cert-manager
      run: ./tests/cert_manager_install.sh

    - name: Install Kubeflow Istio Resources
      run: kustomize build common/istio/kubeflow-istio-resources/base | kubectl apply -f -

    - name: Install KF Multi Tenancy
      run: ./tests/multi_tenancy_install.sh

    - name: Install KF Pipelines
      run: ./tests/pipelines_install.sh

    - name: Install Dashboard
      run: ./tests/dashboard_install.sh

    - name: Install Kubeflow Workspaces
      run: ./tests/workspaces_install.sh

    - name: Create KF Profile
      run: ./tests/kubeflow_profile_install.sh

    - name: Apply PodDefaults to access ml-pipeline with projected token
      run: kubectl apply -f tests/poddefaults.access-ml-pipeline.kubeflow-user-example-com.yaml

    - name: Run Kubeflow Workspaces Pipeline Test
      run: ./tests/workspaces_pipeline_run_test.sh

    - name: Apply Pod Security Standards restricted levels
      run: ./tests/PSS_enable.sh

    - name: Collect Logs on Failure
      if: failure()
      # kubectl has no request timeout by default, so bound this step and
      # let the upload below still run if the API server stops responding.
      timeout-minutes: 5
      run: |
        mkdir -p logs
        kubectl get all --all-namespaces > logs/resources.txt
        kubectl get events --all-namespaces --sort-by=.metadata.creationTimestamp > logs/events.txt
        kubectl get workspace test -n kubeflow-user-example-com -o yaml > logs/workspace-test.yaml 2>&1 || true
        kubectl get workspacekind jupyterlab -o yaml > logs/workspacekind-jupyterlab.yaml 2>&1 || true
        for namespace in kubeflow kubeflow-workspaces kubeflow-user-example-com istio-system cert-manager auth; do
            kubectl describe pods -n $namespace > logs/$namespace-pods.txt
            for pod in $(kubectl get pods -n $namespace -o jsonpath='{.items[*].metadata.name}'); do
                kubectl logs -n $namespace $pod --tail=100 > logs/$namespace-$pod.txt 2>&1 || true
            done
        done

    - name: Upload Diagnostic Logs
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: kubeflow-test-logs
        path: logs/

    # Self-hosted runners keep state between jobs: delete the KinD cluster so
    # the next job can create its own.
    - name: Delete KinD cluster
      if: always()
      run: kind delete cluster --name kubeflow || true
